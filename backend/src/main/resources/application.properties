# =============================================
# Expense Tracker API - Application Properties
# =============================================

# Server
server.port=8080
spring.application.name=expense-tracker-api

# ── Database ──────────────────────────────────
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/expense_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────
# Generate a strong secret (min 32 chars) for HS256
app.jwt.secret=MyExpenseTrackerSuperSecretKeyForJWT2024!ChangeInProd
app.jwt.expiration-ms=86400000

# ── Logging ──────────────────────────────────
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.security=DEBUG
